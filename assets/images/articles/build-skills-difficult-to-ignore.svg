<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">A focused learner building complementary skills with technology</title>
<desc id="desc">Editorial illustration of an African learner at a desk using a laptop, notebook, microphone, and creative tools while skill cards rise around the workspace.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#051634"/><stop offset=".55" stop-color="#0a2b58"/><stop offset="1" stop-color="#0b4d61"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#ffd75e" stop-opacity=".72"/><stop offset="1" stop-color="#ffd75e" stop-opacity="0"/></radialGradient>
  <linearGradient id="desk" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#d89534"/><stop offset="1" stop-color="#f1bd58"/></linearGradient>
  <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#18c7b4"/><stop offset="1" stop-color="#4a76ff"/></linearGradient>
</defs>
<rect width="1200" height="900" rx="48" fill="url(#bg)"/>
<circle cx="725" cy="360" r="340" fill="url(#halo)"/>
<g opacity=".18" stroke="#9fe9e2" fill="none"><path d="M65 195C240 80 365 140 470 250S720 410 930 215"/><path d="M130 710C330 560 490 640 630 740S930 820 1110 625"/><circle cx="100" cy="135" r="34"/><circle cx="1090" cy="170" r="54"/></g>
<!-- skill cards -->
<g font-family="Arial, sans-serif">
  <g transform="translate(55 235) rotate(-5)"><rect width="310" height="112" rx="24" fill="#fff" fill-opacity=".96"/><circle cx="52" cy="56" r="27" fill="#12b9a8"/><path d="M39 57h26M52 44v26" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="92" y="48" font-size="20" font-weight="700" fill="#08234a">Problem Solving</text><text x="92" y="78" font-size="16" fill="#49617d">Create useful results</text></g>
  <g transform="translate(820 140) rotate(4)"><rect width="310" height="112" rx="24" fill="#fff" fill-opacity=".96"/><circle cx="54" cy="56" r="27" fill="#5777ff"/><path d="M41 62l12-20 15 27" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="96" y="48" font-size="20" font-weight="700" fill="#08234a">Technology</text><text x="96" y="78" font-size="16" fill="#49617d">Multiply your strengths</text></g>
  <g transform="translate(795 575) rotate(-3)"><rect width="340" height="112" rx="24" fill="#fff" fill-opacity=".96"/><circle cx="52" cy="56" r="27" fill="#e9a72f"/><path d="M40 64h24M44 54h16M49 44h6" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="92" y="48" font-size="20" font-weight="700" fill="#08234a">Communication</text><text x="92" y="78" font-size="16" fill="#49617d">Make value understood</text></g>
</g>
<!-- desk -->
<g><path d="M250 660h700l74 110H176z" fill="url(#desk)"/><rect x="250" y="760" width="44" height="115" rx="18" fill="#8d5d2c"/><rect x="906" y="760" width="44" height="115" rx="18" fill="#8d5d2c"/></g>
<!-- person -->
