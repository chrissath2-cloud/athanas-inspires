  <path d="M530 385c7-104 150-133 180-37 10 31 5 65-6 89-4-58-23-85-70-101-40 28-74 30-104 49z" fill="#171821"/>
  <path d="M555 465c28 35 83 37 112 2l30 55-153 5z" fill="#5b3328"/>
